[pytest]
# Default to 5 parallel workers (xdist) for fast feedback on an 8-core box.
# Override on CLI with: pytest -n 4 (conservative) or -n 0 (serial).
addopts = -n 5 --dist load --browser firefox

# `load` round-robins tests across workers. Each worker has its own
# function-scoped `page: Page` fixture (provided by pytest-playwright) and
# its own copy of the session-scoped `dashboard_url` URL string. Workers
# read the same on-disk HTML file, which is regenerated exactly once at
# conftest import time, so no race conditions occur.

# When -n 0 is passed, pytest-xdist is disabled and tests run serially.
